<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>식품 원스톱 플랫폼 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 한 화면에 할 일 하나. 위 막대(로고·홈·내 정보·도움 요청) + 가운데 좁은 작업 칸 + 오른쪽 아래 큰 [다음] */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#1E2A24; --muted:#5C6962; --line:#D9E2DB;
  --brand:#2E7D5B; --brand-ink:#FFFFFF; --deep:#1F4D3A; --soft:#E6F1EA;
  --amber:#E9A23B; --amber-soft:#FBEFD9; --amber-ink:#7A4E0A;
  --red:#B4472F; --red-soft:#F8E4DE;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#19221D; --ink:#E6EEE8; --muted:#9BA9A1; --line:#2B3831;
  --brand:#4FA67E; --brand-ink:#0D1611; --deep:#A9D8BD; --soft:#1E3529;
  --amber:#E9A23B; --amber-soft:#3A2D16; --amber-ink:#F3CB82; --red:#E08A72; --red-soft:#3A1F18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#19221D; --ink:#E6EEE8; --muted:#9BA9A1; --line:#2B3831;
  --brand:#4FA67E; --brand-ink:#0D1611; --deep:#A9D8BD; --soft:#1E3529;
  --amber:#E9A23B; --amber-soft:#3A2D16; --amber-ink:#F3CB82; --red:#E08A72; --red-soft:#3A1F18; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.demo{background:var(--amber-soft);color:var(--amber-ink);font-size:14px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center}
.demo button{background:none;border:0;text-decoration:underline;color:inherit;padding:0;font-size:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--deep);font-size:18px;margin-right:auto;background:none;border:0;padding:4px 0;letter-spacing:-.02em}
.logo b{color:var(--brand)}
.nav{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500}
.nav:hover{background:var(--soft)}
.helpbtn{background:var(--amber);color:#2A1B02;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 120px}
.narrow{max-width:720px;margin:0 auto}
h1{font-size:28px;line-height:1.3;margin:0 0 6px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:21px;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;background:var(--brand);color:var(--brand-ink);font-size:17px}
.btn.big{padding:17px 30px;font-size:19px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--soft);color:var(--deep)}
.btn.amber{background:var(--amber);color:#2A1B02}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:10px}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:0;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field .hint{color:var(--muted);font-size:14px}
.inp{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:18px}
.inp:focus{border-color:var(--brand);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:24px}}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.pick{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.pick:hover{border-color:var(--brand)}
.pick.on{border-color:var(--brand);background:var(--soft);box-shadow:0 0 0 2px var(--brand) inset}
.pick b{font-size:18px}
.pick small{color:var(--muted);font-size:14px;line-height:1.5}
.tick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-size:14px;font-weight:800;flex:none}
.pick.on .tick{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* wizard */
.flowhead{margin-bottom:22px}
.crumb{color:var(--muted);font-size:15px}
.stepn{display:inline-block;background:var(--deep);color:var(--surface);font-weight:700;font-size:15px;border-radius:999px;padding:4px 14px;margin:8px 0 12px}
.dots{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px;flex-wrap:wrap}
.dots li{flex:1 1 90px;font-size:13px;color:var(--muted);border-top:5px solid var(--line);padding-top:6px;min-width:0}
.dots li.done{border-color:var(--moss,var(--brand));color:var(--ink)}
.dots li.now{border-color:var(--amber);color:var(--ink);font-weight:700}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:4}
.actions .in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.actions .later{margin-right:auto}
/* rows */
.crow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .k{font-weight:700;color:var(--muted);font-size:15px}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) auto}.crow .k{grid-column:1/-1}}
.say{border-radius:12px;padding:14px 16px;background:var(--soft);color:var(--deep);font-weight:500}
.say.warn{background:var(--amber-soft);color:var(--amber-ink)}
.say.bad{background:var(--red-soft);color:var(--red)}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--deep);white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* home */
.newbtn{width:100%;display:flex;align-items:center;gap:18px;padding:26px;border-radius:16px;border:0;background:var(--brand);color:var(--brand-ink);text-align:left}
.newbtn .plus{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:34px;font-weight:400;flex:none}
.newbtn b{font-size:24px;display:block}
.todo{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo:last-child{border-bottom:0}
.pcard{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard:hover{border-color:var(--brand)}
.thumb{height:92px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
/* product screen */
.band{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;background:var(--deep);color:var(--surface);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.band b{font-size:18px}
.band .sp{margin-left:auto}
.band.none{background:var(--amber-soft);color:var(--amber-ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0;font-size:19px}
.item .d{color:var(--muted);font-size:14px}
.st{margin-top:6px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st.none{color:var(--muted)} .st.review{color:var(--amber-ink)} .st.done{color:var(--brand)} .st.changed{color:var(--red)} .st.locked{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}}
/* upload */
.drop{border:2.5px dashed var(--line);border-radius:16px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;cursor:pointer;background:var(--surface);overflow:hidden;position:relative}
.drop:hover{border-color:var(--brand)}
.drop.ok{border-style:solid;border-color:var(--brand);background:var(--soft)}
.drop img{max-height:170px;border-radius:8px}
.cam{width:54px;height:54px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--brand);font-size:28px}
/* detail editor */
.ed{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.ed{grid-template-columns:minmax(0,1fr)}}
.dp{background:var(--dp-bg);color:var(--dp-ink);border-radius:12px;border:1px solid var(--line);overflow:hidden;max-height:72vh;overflow-y:auto}
.blk{padding:22px 22px;border:3px solid transparent;cursor:pointer;position:relative}
.blk:hover{border-color:color-mix(in srgb,var(--dp-ac) 40%,transparent)}
.blk.on{border-color:var(--amber)}
.blk h4{margin:0 0 6px;font-size:21px;line-height:1.35;color:var(--dp-ac)}
.blk.loud h4{font-size:27px;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--dp-ac) 25%,transparent) 60%);display:inline}
.blk p{margin:6px 0 0;font-size:15px}
.blk.lock{font-size:13px;background:color-mix(in srgb,var(--dp-ink) 5%,transparent)}
.blk.lock h4{font-size:15px;color:var(--dp-ink)}
.blk.lock p{font-size:13px}
.lk{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;background:var(--dp-ink);color:var(--dp-bg);border-radius:99px;padding:2px 9px}
.art{height:150px;border-radius:10px;margin-bottom:14px;display:grid;place-items:center}
.boxart{width:96px;height:124px;border-radius:6px;background:linear-gradient(160deg,#fff 0 30%,transparent 30%),var(--c);box-shadow:6px 8px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:800;line-height:1.2}
.strip{height:80px;border-radius:10px;margin-bottom:12px}
.panel{position:sticky;top:90px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tools .btn{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
/* misc preview */
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.slide{aspect-ratio:16/9;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;color:#1E2A24;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12px;overflow:hidden}
.slide .t{font-weight:800;font-size:15px;color:#1F4D3A}
.slide .ln{height:7px;border-radius:4px;background:#DDE6DF}
.slide.cover{background:#1F4D3A;color:#fff;justify-content:flex-end}
.slide.cover .t{color:#fff;font-size:18px}
.pop{background:#FFFFFF;color:#1E2A24;border-radius:12px;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:8px;max-width:360px}
.pop .ph{font-size:26px;font-weight:800;color:#C2410C;line-height:1.25}
.pop .pr{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:#1E2A24}
.pop .tag{display:inline-block;background:#2E7D5B;color:#fff;border-radius:6px;padding:2px 8px;font-size:14px;font-weight:700}
.pop.banner{max-width:220px;min-height:340px;justify-content:space-between}
.pop.strip2{max-width:100%;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dieline{overflow-x:auto}
.dl{display:grid;grid-template-columns:4fr 3fr 4fr 3fr;grid-template-rows:60px 170px 60px;min-width:560px;gap:0;font-size:13px}
.dl div{border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;color:var(--muted)}
.dl .face{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--surface);flex-direction:column;gap:4px}
.dl .face.front{background:var(--soft)}
.dl .face b{font-size:15px}
.dl .empty{border:0}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;font-size:17px}
.checks li.wait{color:var(--muted)}
.ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:15px;flex:none}
.wait .ck{background:var(--line);color:var(--muted)}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:14px;padding-bottom:20px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl li.done::before{background:var(--brand)}
.prog{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:20px 0 10px}
.prog i{display:block;height:100%;width:0;background:var(--brand);animation:fill var(--dur,2.4s) linear forwards}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.prog i{animation-duration:.01s}}
.diff{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.diff .old{color:var(--muted);text-decoration:line-through;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--deep);color:var(--surface);padding:12px 22px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.55);display:grid;place-items:center;z-index:30;padding:16px}
.ov .card{max-width:460px;width:100%}
.help a{color:inherit}
.big3{display:grid;gap:12px}
.big3 button{text-align:left;padding:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.big3 button b{display:block;font-size:19px}
.big3 small{color:var(--muted)}
.pk{display:flex;flex-direction:column;gap:8px}
.pk .price{font-size:24px;font-weight:800}
.pk ul{margin:4px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}
.pk .rec{align-self:flex-start}
.login{max-width:440px;margin:20px auto}
.sns{display:grid;gap:10px}
.sns .k{background:#FEE500;color:#191600;border:0}
.sns .n{background:#03C75A;color:#fff;border:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.swatch{width:46px;height:46px;border-radius:12px;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
.cbx{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:700;padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cbx input{width:26px;height:26px;accent-color:var(--brand)}
.mini{font-size:14px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>

<!-- Supabase (supabase-js v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Supabase 주소와 키는 config.js 에 따로 있어요 -->
<script src="config.js"></script>
<script>
/* ===== 데이터 ===== */
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const margin=(sup,sell)=>sell>0?((sell-sup)/sell*100).toFixed(2):'0.00';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const two=n=>String(n).padStart(2,'0');
const mmdd=t=>{const d=new Date(t);return two(d.getMonth()+1)+'.'+two(d.getDate())};
const kdate=t=>{const d=new Date(t);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const hsh=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const clone=o=>JSON.parse(JSON.stringify(o));
const ITEMS=[
 {k:'detail',name:'상세페이지',desc:'온라인몰에 올리는 긴 상품 소개',ai:true},
 {k:'pop',name:'POP',desc:'매장에 붙이는 가격표·광고 문구',ai:true},
 {k:'proposal',name:'상품 제안서',desc:'바이어에게 보여주는 소개 자료 (PPT·PDF)'},
 {k:'box',name:'박스 그림',desc:'무지 박스에 들어갈 밑그림'},
 {k:'hanaro',name:'하나로마트 서류',desc:'입점 신청에 내는 서류 2개'},
 {k:'order',name:'박스·POP 발주',desc:'인쇄소에 만들어 달라고 부탁하기'},
];
/* 패키지별 횟수는 서버(grant_package)가 정해요. 여기 글은 고르는 화면에 보여 주는 설명이에요. */
const PKG={
 '실버':{price:'○만 원',lines:['하나로마트 서류·제안서·박스 그림','상세페이지 AI로 만들기 1회 (체험)','POP AI로 만들기 1회 (체험)']},
 '골드':{price:'○○만 원',lines:['실버 전부','상세페이지 AI로 만들기 3회','POP AI로 만들기 3회'],rec:true},
 '프리미엄':{price:'○○만 원',lines:['골드 전부','상세페이지·POP 각 5회','담당자가 대신 만들어 드리기 1회']},
};
/* 구매 내역에 보여 줄 값. 금액이 0(체험)이면 이 예시 글자를 보여 줘요 */
const SKU_PRICE={PKG_SILVER:'○만 원',PKG_GOLD:'○○만 원',PKG_PREMIUM:'○○만 원',ADDON_DETAIL3:'○만 원',ADDON_POP3:'○만 원'};
const THEMES={
 a:{name:'깔끔한 흰색',bg:'#FFFFFF',ac:'#2E7D5B',ink:'#1E2A24',c:'#2E7D5B'},
 b:{name:'따뜻한 쌀빛',bg:'#FBF5E9',ac:'#A8641F',ink:'#3A2A18',c:'#C98B3E'},
 c:{name:'농협 초록',bg:'#EAF4EC',ac:'#1F6B47',ink:'#163626',c:'#3F8F5F'},
 d:{name:'또렷한 대비',bg:'#1E2A24',ac:'#F2C14E',ink:'#FFFFFF',c:'#B98A1E'},
};
const SAMPLE={
 name:'농협 저당 쌀 시리얼 280g',vol:'280g',barcode:'8801448768406',maker:'○○농협 가공사업소',

let sb=null;
/* DB를 부르는 곳은 모두 q()를 지나가요. 실패하면 에러를 던져요. */
async function q(req){const {data,error}=await req;if(error)throw error;return data}
const isNet=e=>navigator.onLine===false||/failed to fetch|networkerror|load failed|network request failed/i.test((e&&e.message)||'');
const isAuth=e=>!!e&&(e.status===401||e.code==='PGRST301'||/jwt expired|invalid jwt/i.test(e.message||''));
function saveFail(e){console.warn('저장 실패',e);
 if(isAuth(e)){toast('로그인이 풀렸어요. 다시 로그인해 주세요',4000);return}
 toast(isNet(e)?'저장이 안 됐어요. 인터넷 연결을 확인해 주세요':'저장이 안 됐어요. 잠시 뒤에 다시 해 주세요',4000)}
function loadFail(e){console.warn('불러오기 실패',e);
 if(isAuth(e)){toast('로그인이 풀렸어요. 다시 로그인해 주세요',4000);return}
 toast(isNet(e)?'불러오지 못했어요. 인터넷 연결을 확인해 주세요':'불러오지 못했어요. 잠시 뒤에 다시 해 주세요',4000)}

/* DB 줄 → 화면에서 쓰는 모양 */
function toCompany(c){return{id:c.id,name:c.name,tel:c.tel||'',biz:c.biz_no||'',ceo:c.ceo||'',gln:c.gln||'',maker:c.maker||'',color:c.color||COLORS[0]}}
function toP(r,assets=[],pkgs=[],orders=[]){
 const st=ST0();assets.forEach(a=>{if(a.product_id===r.id)st[a.kind]=a.status});
 const k=pkgs.find(x=>x.product_id===r.id);
 return{id:r.id,name:r.name,info:{...BLANK_INFO,...(r.info||{}),name:r.name},detail:r.detail||null,popD:r.pop||null,
  pkg:k?k.package:null,cnt:{detail:k?k.detail_left:0,pop:k?k.pop_left:0},helper:k?k.helper_left:0,
  st,order:orders.find(o=>o.product_id===r.id)||null}}

 ]);
 S.P=prods.map(r=>toP(r,assets,pkgs,orders))}

/* 저장하기 */
async function saveCompany(c){
 const row={name:c.name.trim(),tel:c.tel.trim(),biz_no:c.biz.trim(),ceo:c.ceo.trim(),gln:c.gln.trim()||null,maker:c.maker.trim()||c.name.trim(),color:c.color};
 let data;
 if(S.company)data=await q(sb.from('companies').update(row).eq('id',S.company.id).select().single());
 else{
  try{data=await q(sb.from('companies').insert(row).select().single())}
  catch(e){if(e.code!=='23505')throw e; // 다른 창에서 이미 만들었으면 그걸 고쳐요
   const old=await q(sb.from('companies').select('id').eq('owner_id',S.user.id).single());
   data=await q(sb.from('companies').update(row).eq('id',old.id).select().single())}}
 S.company=toCompany(data)}

/* 자동 저장: 상세페이지·POP를 고치면 0.8초 뒤에 한 번에 저장해요 */
const dirty=new Map(); // 상품 id → 저장할 것('detail','pop')
let saveT=null,saving=Promise.resolve();
function markDirty(p,kind){if(!dirty.has(p.id))dirty.set(p.id,new Set());dirty.get(p.id).add(kind)}
function saveSoon(p,kind){markDirty(p,kind);clearTimeout(saveT);saveT=setTimeout(()=>flushSaves().catch(saveFail),800)}
function flushSaves(){clearTimeout(saveT);const run=saving.then(doFlush);saving=run.catch(()=>{});return run}
async function doFlush(){
 for(const [pid,kinds] of [...dirty]){dirty.delete(pid);
  const p=S.P.find(x=>x.id===pid);if(!p)continue;
  const patch={};if(kinds.has('detail'))patch.detail=p.detail;if(kinds.has('pop'))patch.pop=p.popD;
  try{await q(sb.from('products').update(patch).eq('id',pid))}
  catch(e){kinds.forEach(k=>markDirty(p,k));throw e}}} // 실패하면 다음에 다시 저장해요
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty.size)flushSaves().catch(()=>{})});

/* ===== 로그인·가입 =====
   지금: Supabase Auth 의 이메일+비밀번호를 써요.
   실서비스: 샵바이 회원 로그인으로 바뀌어요. 그때는 아래 auth… 네 함수 안쪽만 바꾸면 돼요.
            (샵바이 회원번호는 companies.shopby_member_no 에 서버가 채워요) */
async function authSession(){const {data,error}=await sb.auth.getSession();if(error)throw error;return data.session?data.session.user:null}
async function authSignIn(email,pw){const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw authErr(error);return data.user}
async function authSignUp(email,pw,meta){const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:meta}});if(error)throw authErr(error);
 return{user:data.user,needConfirm:!data.session}} // needConfirm: 이메일 확인을 켜 둔 경우
async function authSignOut(){const {error}=await sb.auth.signOut();if(error)console.warn(error)}
function authErr(e){const m=(e.message||'').toLowerCase();
 e.friendly=isNet(e)?'연결이 안 됐어요. 인터넷 연결을 확인해 주세요'
  :m.includes('invalid login')?'아이디나 비밀번호가 맞지 않아요'
  :m.includes('already')&&m.includes('registered')?'이미 가입한 이메일이에요. 로그인해 주세요'
  :m.includes('not confirmed')?'이메일 확인이 아직 안 됐어요. 받은 편지의 버튼을 눌러 주세요'
  :m.includes('rate limit')||e.status===429?'요청이 너무 많았어요. 잠시 뒤에 다시 해 주세요'
  :m.includes('password')?'비밀번호를 8자 이상, 숫자를 섞어서 정해 주세요'
  :m.includes('email')?'이메일 주소를 다시 확인해 주세요'
  :'잘 안 됐어요. 잠시 뒤에 다시 해 주세요';
 return e}
const okEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim());
const okPw=v=>/^(?=.*\d).{8,}$/.test(v||'');

 try{S.user=await authSignIn(email,pw);await enterApp()}

let toastT;

/* ===== 마법사(단계 화면) ===== */
function startFlow(flow,data={},i=0){
 if(S.wiz){const F=FLOWS[S.wiz.flow];F.leave&&F.leave(S.wiz)}
 S.wiz={flow,i,d:data,tok:Math.random()};S.screen='wiz';S.sel=null;enterStep();render();window.scrollTo(0,0)}
function enterStep(){const w=S.wiz,st=FLOWS[w.flow].steps[w.i];st.enter&&st.enter(w.d);
 if(st.auto){const tok=w.tok=Math.random();setTimeout(()=>{if(S.wiz&&S.wiz.tok===tok){wNext()}},st.auto)}}
/* [다음]: before(저장 등)가 끝나야 넘어가요. before 가 false 를 돌려주거나 실패하면 그 자리에 있어요 */
async function wNext(){const w=S.wiz;if(!w||S.busy)return;const F=FLOWS[w.flow],st=F.steps[w.i];
 if(st.ok&&!st.ok(w.d))return;
 setBusy(true);
 try{
  if(st.before&&await st.before(w.d)===false)return;
  if(S.wiz!==w)return;
  if(w.i>=F.steps.length-1){await F.finish(w.d);return}
  w.i++;enterStep();render();window.scrollTo(0,0)
 }catch(e){e&&e.friendly?toast(e.friendly,4000):saveFail(e)}
 finally{setBusy(false)}}
function wPrev(){const w=S.wiz;if(!w||S.busy)return;const F=FLOWS[w.flow];
 let i=w.i-1;while(i>=0&&F.steps[i].auto)i--;
 if(i<0){F.back?F.back():go('home');return}
 w.i=i;w.tok=Math.random();enterStep();render();window.scrollTo(0,0)}
function setBusy(b){S.busy=b;const btn=document.getElementById('nextBtn');if(!btn)return;if(b)btn.disabled=true;else upd()}
function upd(){const w=S.wiz;if(!w)return;const st=FLOWS[w.flow].steps[w.i];const b=document.getElementById('nextBtn');if(b)b.disabled=S.busy||(st.ok?!st.ok(w.d):false)}
function setD(k,v){S.wiz.d[k]=v;upd()}
function setDR(k,v){S.wiz.d[k]=v;render()}
function togD(k,v){const a=S.wiz.d[k]||(S.wiz.d[k]=[]);const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()}
const VIEWS={};
VIEWS.wiz=()=>{const w=S.wiz,F=FLOWS[w.flow],st=F.steps[w.i];const sub=F.sub&&F.sub();
 return `<div class="${st.wide?'':'narrow'}"><div class="flowhead">
 <div class="crumb">${F.name}${sub?' · '+esc(sub):''}</div>
 <div class="stepn">${F.steps.length}단계 중 ${w.i+1}단계</div>
 <ol class="dots">${F.steps.map((s,j)=>`<li class="${j<w.i?'done':j===w.i?'now':''}">${s.short||s.title}</li>`).join('')}</ol>
 <h1>${st.title}</h1>${st.lead?`<p class="lead">${typeof st.lead==='function'?st.lead(w.d):st.lead}</p>`:''}</div>
 ${st.body(w.d)}</div>`};
function wizActions(){const w=S.wiz,F=FLOWS[w.flow],st=F.steps[w.i];if(st.auto)return '';
 const ok=(st.ok?st.ok(w.d):true)&&!S.busy;const last=w.i===F.steps.length-1;
 return `<div class="actions"><div class="in">
 ${st.later?`<button class="link later" onclick="${st.later}">나중에 할게요</button>`:''}
 ${st.noPrev?'':`<button class="btn ghost" onclick="wPrev()">이전</button>`}
 <button class="btn big" id="nextBtn" ${ok?'':'disabled'} onclick="wNext()">${st.next?(typeof st.next==='function'?st.next(w.d):st.next):last?'마치기':'다음'}</button></div></div>`}
const pickCard=(on,title,small,click,extra='')=>`<button class="pick ${on?'on':''}" onclick="${click}"><span class="row" style="gap:10px"><span class="tick">${on?'✓':''}</span><b>${title}</b>${extra}</span>${small?`<small>${small}</small>`:''}</button>`;
const making=(msg,sub,dur=2.4)=>`<div class="card"><h2>${msg}</h2><div class="prog" style="--dur:${dur}s"><i></i></div><p class="mini">${sub}</p></div>`;

/* ===== 결제 =====
   지금: 가짜 결제창 → [결제 마치기]를 누르면 체험용 함수(demo_buy_package / demo_buy_addon)로 바로 붙여요.
   실서비스: chargeDemo() 안쪽을 "샵바이 결제창 열기"로 바꿔요. 결제가 끝나면 샵바이 웹훅(shopby-webhook)이
            grant_package / grant_addon 을 불러서 횟수를 붙여요. 화면은 끝난 뒤 reloadPackage(p)로 다시 읽기만 하면 돼요.
   pay(job) 은 결제가 끝나면 true, 취소하면 false 를 돌려줘요.
   job: {title, price, product, pkg:'실버'|'골드'|'프리미엄'} 또는 {title, price, product, kind:'detail'|'pop'} */
function pay(job){return new Promise(res=>{S.pay={job,res,going:false};S.overlay=payOverlay;render()})}
function payOverlay(){const x=S.pay;if(!x)return '';const off=x.going?'disabled':'';
 return `<div class="ov"><div class="card stack" role="dialog" aria-label="결제 창">
 <span class="chip gray" style="align-self:flex-start">결제 회사 창 (체험판)</span>
 <h2>${esc(x.job.title)}</h2><div class="price" style="font-size:28px;font-weight:800">${x.job.price}</div>
 <p class="mini">실제 서비스에서는 여기서 카드 번호를 넣어요. 체험판이라 실제로 결제되지 않아요.</p>
 <div class="row"><button class="btn ghost" ${off} onclick="payCancel()">취소</button><button class="btn big" ${off} onclick="payConfirm()">결제 마치기</button></div></div></div>`}
function payCancel(){const x=S.pay;if(!x||x.going)return;S.pay=null;S.overlay=null;render();x.res(false)}
async function payConfirm(){const x=S.pay;if(!x||x.going)return;x.going=true;render();
 try{await chargeDemo(x.job);S.pay=null;S.overlay=null;x.res(true)}
 catch(e){x.going=false;render();saveFail(e)}}
async function chargeDemo(job){ // 체험용. 실서비스 전에 바꿔 끼워요
 if(job.pkg)await q(sb.rpc('demo_buy_package',{p_product_id:job.product.id,p_package:job.pkg}));
 else await q(sb.rpc('demo_buy_addon',{p_product_id:job.product.id,p_kind:job.kind}));
 await reloadPackage(job.product)}
const payBody=d=>`<div class="stack"><div class="card"><div class="row" style="justify-content:space-between"><span>${esc(d.what)}</span><b style="font-size:22px">${d.price}</b></div></div>
 <div class="grid2">${['신용카드','계좌이체','카카오페이','네이버페이'].map(m=>pickCard(d.pay===m,m,'',`setDR('pay','${m}')`)).join('')}</div>
 <p class="mini">결제는 이 사이트에서 바로 해요. 카드 번호 넣는 창만 따로 떠요.</p></div>`;

 {id:'b3',t:'text',title:info.pros[1],body:'한 번 먹는 양(30g)에 당류는 3g뿐이에요. 아이 간식으로도 마음 놓고 주세요.',hue:2},
 {id:'b4',t:'text',title:info.pros[2],body:'기름에 튀기지 않고 오븐에 구워서 바삭하고 가벼워요.',hue:3},
 {id:'b5',t:'text',title:'우유만 부으면 끝',body:'바쁜 아침, 1분이면 한 끼가 준비돼요. 요거트에 뿌려 먹어도 좋아요.',hue:4},
 {id:'b6',t:'lock',title:'원재료 · 알레르기',body:info.raw+' / '+info.allergy},

]}
const ARTS=['#E9D8B4','#CFE3D4','#F3E0C7','#DCE7F0','#EAD9E4','#D9E8C9'];
/* 만든 것을 저장하고 '만들어 놨어요'로 표시해요. 그래야 새로고침해도 이어서 볼 수 있어요.
   저장이 안 되면 알려 주고, 다음에 고치거나 확정할 때 다시 저장해요 */
async function keepMade(p,kind){markDirty(p,kind);
 try{await flushSaves();if(p.st[kind]!=='done')await setStatus(p,kind,'review')}catch(e){saveFail(e)}}
/* 만들다가 다른 화면으로 가면: 아직 표시가 안 됐을 때만 '만들어 놨어요'로 바꿔요 */
function leaveMade(kind){return w=>{const p=cur();if(!p)return;
 if(dirty.size)flushSaves().catch(saveFail);
 if(w.i===3&&(kind==='detail'?p.detail:p.popD)&&p.st[kind]!=='done'&&p.st[kind]!=='review')
  setStatus(p,kind,'review').then(()=>{if(S.screen!=='wiz')render()}).catch(saveFail)}}

 steps:[
 {title:'무엇을 가장 내세울까요?',short:'내세울 점',lead:'여러 개 골라도 돼요. 고른 순서대로 앞에 나와요.',ok:d=>(d.pts||[]).length>0,body:d=>`<div class="grid2">${[
   ['원재료·산지','국산 쌀, 우리 땅에서 난 재료'],['맛·식감','고소하고 바삭한 맛'],['간편함·쓰임새','우유만 부으면 끝, 요거트 토핑'],['건강·안심','저당, 튀기지 않음, HACCP']].map(([t,s])=>pickCard((d.pts||[]).includes(t),t,s,`togD('pts','${t}')`)).join('')}</div>`},
 {title:'디자인을 골라 주세요',short:'디자인 고르기',lead:d=>`디자인을 고르고 만들면 AI로 만들기 <b>1회</b>를 써요. 지금 <b>${cur().cnt.detail}회</b> 남았어요.`,ok:d=>d.th,next:'이 디자인으로 만들기',wide:true,
  body:d=>`<div class="grid4">${Object.entries(THEMES).map(([k,t])=>`<button class="pick ${d.th===k?'on':''}" onclick="setDR('th','${k}')">
   <div style="background:${t.bg};border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;height:150px">
    <div style="height:46px;border-radius:6px;background:${t.c}"></div><div style="height:9px;width:80%;border-radius:4px;background:${t.ac}"></div>
    <div style="height:6px;border-radius:4px;background:${t.ink};opacity:.25"></div><div style="height:6px;width:70%;border-radius:4px;background:${t.ink};opacity:.25"></div></div>
   <span class="row" style="gap:8px"><span class="tick">${d.th===k?'✓':''}</span><b>${t.name}</b></span></button>`).join('')}</div>`,
  before:async d=>{const p=cur();
   if(!await spend(p,'detail'))return false; // 횟수를 쓰는 데 성공해야만 다음으로 가요
   p.detail=await aiMakeDetail(p,{pts:d.pts,th:d.th});
   await keepMade(p,'detail')}},
 {title:'상세페이지를 만들고 있어요',short:'만드는 중',auto:2600,body:()=>making('AI가 글과 사진을 배치하고 있어요','보통 1~2분 걸려요. 체험판은 바로 끝나요. 다른 화면으로 가도 계속 만들어요.',2.5)},
 {title:'확인하고 고쳐 주세요',short:'확인·고치기',lead:'고칠 부분을 눌러 고르세요. 글 고치기와 말로 부탁하기는 횟수를 쓰지 않아요.',noPrev:true,later:"go('product')",next:'이대로 확정',wide:true,body:()=>editorHTML(cur())},
 ],finish:async()=>{const p=cur();markDirty(p,'detail');await flushSaves();await setStatus(p,'detail','done');
  log(p.name+' 상세페이지를 확정했어요',p.id);S.wiz=null;go('product');toast('상세페이지를 확정했어요')}};
function editorHTML(p){const D=p.detail,t=THEMES[D.th]||THEMES.a;const b=D.blocks.find(x=>x.id===S.sel);
 return `<div class="ed"><div class="dp" style="--dp-bg:${t.bg};--dp-ac:${t.ac};--dp-ink:${t.ink}">${D.blocks.map(x=>blockHTML(x,t,p)).join('')}</div>
 <div class="panel card stack">${!b?`<h2>고칠 부분을 눌러 주세요</h2><p class="mini" style="margin:0">왼쪽 미리보기에서 바꾸고 싶은 부분을 누르면 여기에 고치는 버튼이 나와요. 고친 내용은 자동으로 저장돼요.</p>
   <div class="say">다 마음에 들면 오른쪽 아래 <b>[이대로 확정]</b>을 눌러 주세요.</div>
   <button class="btn ghost" onclick="remake()">처음부터 다시 만들기 (1회 써요 · ${p.cnt.detail}회 남음)</button>`
 :b.t==='lock'?`<h2>${esc(b.title)}</h2><div class="say warn">이 부분은 표시사항이라 여기서 고칠 수 없어요. 상품 정보를 고치면 자동으로 같이 바뀌어요.</div><button class="btn ghost" onclick="S.sel=null;render()">다른 부분 고르기</button>`
 :`<h2>고른 부분: ${esc(b.title)}</h2>
   ${S.editTxt?`<div class="field"><label for="et">제목</label><input id="et" class="inp" value="${esc(b.title)}"></div><div class="field"><label for="eb">내용</label><textarea id="eb" class="inp" rows="4">${esc(b.body)}</textarea></div><button class="btn" onclick="saveTxt()">다 고쳤어요</button>`
   :`<div class="tools"><button class="btn soft" onclick="S.editTxt=1;render()">글 고치기</button><button class="btn soft" onclick="bAct('photo')">사진 바꾸기</button>
   <button class="btn soft" onclick="bAct('up')">위로 올리기</button><button class="btn soft" onclick="bAct('down')">아래로 내리기</button>
   <button class="btn ghost" style="grid-column:1/-1" onclick="bAct('del')">이 부분 빼기</button></div>
   <div><b>말로 부탁하기</b><div class="chips" style="margin-top:8px"><button class="btn sm soft" onclick="ask('short')">더 짧게</button><button class="btn sm soft" onclick="ask('soft')">더 부드럽게</button><button class="btn sm soft" onclick="ask('loud')">더 눈에 띄게</button></div>
   <div class="row" style="margin-top:10px"><input id="askT" class="inp" style="flex:1;min-width:0" placeholder="예: 아이 엄마에게 말하듯 써 줘"><button class="btn sm" onclick="ask('free')">부탁하기</button></div></div>`}`}
 </div></div>`}
function blockHTML(x,t,p){const on=S.sel===x.id?' on':'';
 if(x.t==='hero')return `<div class="blk${on}${x.loud?' loud':''}" onclick="selB('${x.id}')"><div class="art" style="background:${ARTS[x.hue%6]}"><div class="boxart" style="--c:${t.c}">농협<br>저당 쌀<br>시리얼</div></div><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></div>`;
 if(x.t==='lock')return `<div class="blk lock${on}" onclick="selB('${x.id}')"><span class="lk">잠김</span><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></div>`;
 return `<div class="blk${on}${x.loud?' loud':''}" onclick="selB('${x.id}')"><div class="strip" style="background:${ARTS[x.hue%6]}"></div><h4>${esc(x.title)}</h4><p>${esc(x.body)}</p></div>`}
function selB(id){S.sel=id;S.editTxt=0;render()}
/* 아래 고치기 동작은 모두 saveSoon 으로 자동 저장돼요 */
function saveTxt(){const p=cur(),b=p.detail.blocks.find(x=>x.id===S.sel);b.title=document.getElementById('et').value;b.body=document.getElementById('eb').value;S.editTxt=0;saveSoon(p,'detail');render();toast('고쳤어요')}
function bAct(a){const p=cur(),B=p.detail.blocks,i=B.findIndex(x=>x.id===S.sel),b=B[i];
 if(a==='photo'){b.hue++;toast('사진을 바꿨어요')}
 if(a==='up'&&i>0){[B[i-1],B[i]]=[B[i],B[i-1]]}
 if(a==='down'&&i<B.length-1&&B[i+1].t!=='lock'){[B[i+1],B[i]]=[B[i],B[i+1]]}
 if(a==='del'){B.splice(i,1);S.sel=null;toast('이 부분을 뺐어요')}
 saveSoon(p,'detail');render()}
async function ask(k){const p=cur(),b=p.detail.blocks.find(x=>x.id===S.sel);
 const text=k==='free'?document.getElementById('askT').value.trim():'';
 if(k==='free'&&!text){toast('부탁할 말을 써 주세요');return}
 const r=await aiRewrite(b,k,text);if(r&&r.msg){toast(r.msg);return}
 saveSoon(p,'detail');render();toast('부탁한 대로 고쳤어요 (횟수 안 씀)')}
function remake(){const p=cur();if(p.cnt.detail<1){noCredit('detail');return}
 startFlow('detail',{pts:p.detail.pts||['원재료·산지'],th:p.detail.th},1)}

  return{c:'done',t:'확정했어요',b:`<button class="btn ghost" onclick="openItem('${k}')">보기·고치기</button>`}}
 if(s==='review')return{c:'review',t:'만들어 놨어요. 확인해 주세요',b:`<button class="btn amber" onclick="openItem('${k}')">확인하기</button>`};
 if(s==='changed')return{c:'changed',t:'가격이 바뀌었어요. 다시 만들어 주세요',b:`<button class="btn" onclick="redo('${k}')">다시 만들기</button>`};

async function applyPrice(){const p=cur(),old=p.info.sup,nw=S.np;if(!nw||nw===old){go('product');return}
 if(S.busy)return;S.busy=true;
 try{const was={...p.st};const {name,...info}=p.info;info.sup=nw;
  await q(sb.from('products').update({info}).eq('id',p.id));
  p.info.sup=nw;await reloadAssets(p);
  const hit=ITEMS.map(i=>i.k).filter(k=>p.st[k]==='changed'&&was[k]!=='changed');
  log(p.name+' 공급가를 '+fmt(old)+'원에서 '+fmt(nw)+'원으로 바꿨어요',p.id);go('changed',{chg:{old,nw,sell:p.info.sell,hit}})}
 catch(e){saveFail(e)}finally{S.busy=false}}

const won=b=>b.amount>0?fmt(b.amount)+'원':(SKU_PRICE[b.sku]||'');
VIEWS.me=()=>`<div class="narrow stack" style="gap:18px"><h1>내 정보</h1>
 <section class="card"><h2>업체 정보</h2>${[['업체 이름',S.company.name],['연락처',S.company.tel],['사업자등록번호',S.company.biz],['대표자',S.company.ceo],['GLN 번호',S.company.gln||'아직 안 넣었어요'],['제조원',S.company.maker]].map(([k,v])=>`<div class="crow" style="grid-template-columns:150px minmax(0,1fr)"><span class="k">${k}</span><span>${esc(v)}</span></div>`).join('')}
  <button class="btn soft" style="margin-top:12px" onclick="startFlow('company',{c:{...S.company}})">업체 정보 고치기</button></section>
 <section class="card"><h2>구매 내역·영수증</h2>${S.buys.length?`<table class="t"><tbody>${S.buys.map(b=>`<tr><td class="num">${mmdd(b.created_at)}</td><td>${esc(b.title)}${b.status==='refunded'?' <span class="chip gray">환불했어요</span>':''}</td><td class="n">${won(b)}</td><td class="n"><button class="btn sm ghost" onclick="downloadFile('receipt','${b.id}')">영수증</button></td></tr>`).join('')}</tbody></table>`:'<p class="mini" style="margin:0 0 8px">아직 구매한 것이 없어요.</p>'}
  <p class="mini">자료 횟수를 쓰기 전에는 환불할 수 있어요.</p></section>
 <section class="card"><h2>지난 기록</h2>${S.log.length?S.log.map(l=>`<div class="todo"><span>${esc(l.message)}</span><span class="mini num">${mmdd(l.created_at)}</span></div>`).join(''):'<p class="mini" style="margin:0">아직 기록이 없어요.</p>'}</section>
 <section class="card"><h2>계정</h2><div class="crow" style="grid-template-columns:150px minmax(0,1fr) auto"><span class="k">아이디</span><span>${esc(S.user.email)}</span><button class="btn sm ghost" onclick="logout()">로그아웃</button></div></section></div>`;

/* ===== 시작: 접속하면 로그인돼 있는지 확인해요. 돼 있으면 홈, 아니면 로그인 화면 ===== */
async function boot(){
 render();
 const C=window.APP_CONFIG||{};
 if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||/YOUR-PROJECT/.test(C.SUPABASE_URL)||/YOUR-ANON-KEY/.test(C.SUPABASE_ANON_KEY)){S.screen='setup';render();return}
 if(!window.supabase){S.screen='bootfail';render();return} // supabase-js 를 못 불러왔어요
 sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
 sb.auth.onAuthStateChange(ev=>{ // 다른 창에서 로그아웃했거나 로그인이 풀렸을 때
  if(ev==='SIGNED_OUT'&&S.user){S=init();S.screen='login';render()}});
 try{
  S.user=await authSession();
  if(!S.user){go('login');return}
  await enterApp()
 }catch(e){console.warn(e);
  if(isAuth(e)){await authSignOut();S=init();go('login');return}
  S.screen='bootfail';render()}
}
boot();
</script>
</body>
</html>
